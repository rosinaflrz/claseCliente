<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV – Tu Nombre</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <meta name="description" content="Currículum en línea" />
</head>
<body>
  <header class="site-header container">
    <div class="hero">
      <img id="avatar" class="avatar" src="./images/avatar.jpg" alt="Foto de perfil" />
      <div>
        <h1 id="name">Tu Nombre</h1>
        <p id="headline" class="muted"></p>
        <ul id="links" class="links"></ul>
      </div>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>Perfil</h2>
      <p id="summary"></p>
    </section>

    <section>
      <h2>Experiencia</h2>
      <div id="experience" class="cards"></div>
    </section>

    <section>
      <h2>Educación</h2>
      <ul id="education" class="list"></ul>
    </section>

    <section>
      <h2>Habilidades</h2>
      <ul id="skills" class="tags"></ul>
    </section>

    <section>
      <h2>Proyectos</h2>
      <div id="projects" class="grid"></div>
    </section>

    <section>
      <h2>Contacto</h2>
      <form id="contactForm" class="contact" method="POST">
        <div class="field">
          <label for="nameInput">Nombre</label>
          <input id="nameInput" name="name" type="text" placeholder="Tu nombre" required minlength="2" />
        </div>
        <div class="field">
          <label for="emailInput">Email</label>
          <input id="emailInput" name="email" type="email" placeholder="tu@correo.com" required />
        </div>
        <div class="field">
          <label for="messageInput">Mensaje</label>
          <textarea id="messageInput" name="message" placeholder="Hola..." required minlength="10"></textarea>
        </div>
        <input type="hidden" name="_subject" value="Nuevo contacto desde el CV" />
        <button type="submit" class="btn">Enviar</button>
        <p id="formStatus" class="status muted" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer container">
    <small>© <span id="year"></span> <span id="footerName">Tu Nombre</span></small>
  </footer>

  <script src="./assets/main.js" type="module"></script>
</body>
</html>
